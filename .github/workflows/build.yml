name: Vérification

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Choisir la version d'Xcode la plus récente
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Xcode choisi : $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Tests de la logique (séries, IA, nettoyage)
        run: |
          swiftc -O Petale/Core/*.swift Tests/main.swift -o "$RUNNER_TEMP/logictests"
          "$RUNNER_TEMP/logictests"

      - name: Compilation de l'app pour iPhone (sans signature)
        run: |
          set -o pipefail
          xcodebuild \
            -project Petale.xcodeproj \
            -scheme Petale \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/build.log"
